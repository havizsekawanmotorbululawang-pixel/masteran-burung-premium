
      - name: Build debug APK
        run: |
          PROJECT_FILE=$(find extracted -type f -name settings.gradle.kts -o -name settings.gradle | head -n 1)
          if [ -z "$PROJECT_FILE" ]; then
            echo "File settings.gradle tidak ditemukan"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Masteran-Burung-Premium-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
